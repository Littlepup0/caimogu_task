name: Java CI with Maven
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
concurrency:
  group: caimogu-task
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 1.8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        env:
          OWNER_REPO: ${{secrets.OWNER_REPO}}
          MY_GITHUB_API_TOKEN: ${{secrets.MY_GITHUB_API_TOKEN}}
          CMG_PASSWORD: ${{secrets.CMG_PASSWORD}}
          CMG_NAME: ${{secrets.CMG_NAME}}
          REPO_PATH: ${{secrets.REPO_PATH}}
          SUB_ACCOUNT: ${{secrets.SUB_ACCOUNT}}
        run: mvn -B -q package --file pom.xml
